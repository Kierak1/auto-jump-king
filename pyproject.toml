[project]
name = "auto-jump-king"
version = "0.1.0"
description = "Autonomous Jump King player: screen-capture state in, System One decisions out, precise input"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lz4>=4.4.5",
    "mss>=10.0.0",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "pillow>=11.0",
    "pymem>=1.14.0",
    "typesafe-sdk>=0.7.0",
]

[project.optional-dependencies]
local = ["system-one-adapter[openai]"]

[dependency-groups]
dev = ["ruff>=0.9"]

[project.scripts]
ajk = "ajk.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ajk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
